<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniGame Universe – Joueur</title>
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="images/LogoMiniGame.png">
  <link rel="stylesheet" href="css/invite.css">
  <link rel="stylesheet" href="css/reglages.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     NAVBAR INVITÉ
═══════════════════════════════════════════════════════ -->
<nav class="invite-navbar" id="invite-navbar" aria-label="Navigation invité">
  <button class="invite-nav-btn" id="btn-home-permanent"
          aria-label="Retour à l'accueil">🏠</button>
  <button class="invite-nav-btn" id="btn-scores-invite"
          aria-label="Afficher le tableau des scores">🏆</button>
  <button class="invite-nav-btn" id="btn-menu-permanent"
          aria-label="Ouvrir le menu">☰</button>
</nav>


<!-- ═══════════════════════════════════════════════════════
     PHASE 1 — IDENTIFICATION
     Visible au chargement. Masquée par player.js après JOIN_OK.
     IDs lus par jeu.js : #id-meta-*, #id-pseudo, #btn-join, #id-etat
═══════════════════════════════════════════════════════ -->
<div id="phase-identification">
  <div class="id-card">

    <img src="images/LogoMiniGame.png" alt="Logo MiniGame Universe"
         class="id-logo" onerror="this.style.display='none'">

    <h1 class="id-title">Rejoindre la partie</h1>
    <p class="id-subtitle" id="id-subtitle">
      Tu as été invité·e à rejoindre MiniGame Universe
    </p>

    <!-- Méta de la partie — remplies par jeu.js depuis l'URL -->
    <div class="id-meta" id="id-meta">

      <div class="id-meta-row" id="id-row-hote" style="display:none;">
        <span class="id-meta-label">Hôte</span>
        <span class="id-meta-val" id="id-meta-hote">—</span>
      </div>

      <div class="id-meta-row">
        <span class="id-meta-label">Partie</span>
        <span class="id-meta-val" id="id-meta-nom">—</span>
      </div>

      <div class="id-meta-row">
        <span class="id-meta-label">Jeu</span>
        <span class="id-meta-val" id="id-meta-jeu">—</span>
      </div>

      <div class="id-meta-row" id="id-row-date" style="display:none;">
        <span class="id-meta-label">Créée le</span>
        <span class="id-meta-val" id="id-meta-date">—</span>
      </div>

      <div class="id-meta-row">
        <span class="id-meta-label">ID</span>
        <span class="id-meta-val id-meta-mono" id="id-meta-id">—</span>
      </div>

    </div>

    <!-- Formulaire pseudo : jeu.js lit #id-pseudo et #btn-join -->
    <div id="id-corps">
      <input
        id="id-pseudo"
        class="id-input-pseudo"
        type="text"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
        placeholder="Entre ton pseudo…"
        aria-label="Ton pseudo"
      >
      <button id="btn-join" class="id-btn-rejoindre">
        🚀 Rejoindre la partie
      </button>
    </div>

    <!-- Zone d'état : erreurs, chargement, messages WS -->
    <div class="id-etat" id="id-etat" role="status" aria-live="polite"></div>

    <a href="index.html" class="id-back-link">← Retour à l'accueil</a>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════
     PHASE 2 — JEU
     Masquée au chargement. Affichée après JOIN_OK / GAME_STARTED.
       .jeu-header   — barre fixe en haut (pseudo, partie, badge)
       #jeu-contenu  — contenu dynamique (attente / countdown / jeu / fin)
═══════════════════════════════════════════════════════ -->
<div id="phase-jeu">

  <header class="jeu-header">
    <div class="jeu-header-left">
      <span class="jeu-pseudo" id="hdr-pseudo">—</span>
      <span class="jeu-partie" id="hdr-partie">—</span>
    </div>
    <span class="jeu-badge" id="hdr-jeu">—</span>
  </header>

  <main id="jeu-contenu"></main>

</div>


<!-- Point d'entrée unique — aucun autre script -->
<script type="module" src="js/jeu.js"></script>

</body>
</html>
