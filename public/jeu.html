<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniGame Universe – Joueur</title>
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="images/LogoMiniGame.png">
  <link rel="stylesheet" href="css/invite.css">
  <link rel="stylesheet" href="css/reglages.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     BARRE DE NAVIGATION PERMANENTE (invité)
     Visible dès que #phase-jeu est actif.
═══════════════════════════════════════════════════════════ -->
<nav class="invite-navbar" id="invite-navbar" aria-label="Navigation invité">

  <!-- Accueil (bascule vers index.html en tant qu'hôte) -->
  <button class="invite-nav-btn" id="btn-home-permanent" aria-label="Retour à l'accueil">
    🏠
  </button>

  <!-- Menu invité -->
  <button class="invite-nav-btn" id="btn-menu-permanent" aria-label="Ouvrir le menu">
    ☰
  </button>
</nav>

<!-- ═══════════════════════════════════════════════════════════
     PHASE 1 : IDENTIFICATION
     Tout le contenu (#id-corps, méta) est injecté par jeu.js.
     Aucun script inline ici — GameManager gère tout.
═══════════════════════════════════════════════════════════ -->
<div id="phase-identification">
  <div class="id-card">

    <img src="images/LogoMiniGame.png" alt="Logo" class="id-logo" onerror="this.style.display='none'">
    <h1 class="id-title">Rejoindre la partie</h1>
    <p class="id-subtitle" id="id-subtitle">Tu as été invité·e à une partie MiniGame Universe</p>

    <!-- Méta remplies par GameManager._remplirMeta() -->
    <div class="id-meta" id="id-meta">
      <div class="id-meta-row" id="id-row-hote" style="display:none;">
        <span class="id-meta-label">Hôte</span>
        <span class="id-meta-val" id="id-meta-hote">—</span>
      </div>
      <div class="id-meta-row">
        <span class="id-meta-label">Partie</span>
        <span class="id-meta-val" id="id-meta-nom">—</span>
      </div>
      <div class="id-meta-row">
        <span class="id-meta-label">Jeu</span>
        <span class="id-meta-val" id="id-meta-jeu">—</span>
      </div>
      <div class="id-meta-row" id="id-row-date" style="display:none;">
        <span class="id-meta-label">Créée le</span>
        <span class="id-meta-val" id="id-meta-date">—</span>
      </div>
      <div class="id-meta-row">
        <span class="id-meta-label">ID</span>
        <span class="id-meta-val" id="id-meta-id" style="font-size:.72rem;opacity:.55;font-family:monospace;">—</span>
      </div>
    </div>

    <!-- Champ pseudo + bouton injectés par GameManager._construireCorps() -->
    <div id="id-corps"></div>

    <!-- Zone état injectée par GameManager._phaseId.afficherEtat() -->
    <div class="id-etat" id="id-etat"></div>

    <a href="index.html" style="display:inline-block;margin-top:18px;font-size:.8rem;color:rgba(255,255,255,.4);text-decoration:none;">← Retour à l'accueil</a>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     PHASE 2 : JEU
     Header + contenu dynamique géré par GameManager.
═══════════════════════════════════════════════════════════ -->
<div id="phase-jeu">
  <div class="jeu-header">
    <div class="jeu-header-left">
      <span class="jeu-pseudo" id="hdr-pseudo">—</span>
      <span class="jeu-partie" id="hdr-partie">—</span>
    </div>
    <span class="jeu-badge" id="hdr-jeu">—</span>
  </div>
  <div id="jeu-contenu"></div>
</div>


<!-- ═══════════════════════════════════════════════════════════
     POINT D'ENTRÉE UNIQUE
     jeu.js (module ES6) s'initialise sur DOMContentLoaded
     et expose window.GameManager pour le debug console.
     Aucun autre script — pas de conflit de timing.
═══════════════════════════════════════════════════════════ -->
<script type="module" src="js/jeu.js"></script>

</body>
</html>
